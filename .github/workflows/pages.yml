# Builds the static site and publishes it to GitHub Pages.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job only reads the repository. Only the deploy job may publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check, unit tests and build
        run: npm run check
        env:
          SITE_ORIGIN: https://othmanadi.github.io/bookmark-bookshelf
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
