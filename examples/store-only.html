<!doctype html>
<html lang="en" data-variant="paper">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-sEPyJT05LkZGU7u7phyfvkISZabtu9H4Q8+OlaEFUDM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Store: a Bookmark Bookshelf example</title>
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  </head>
  <body class="bb-example">
    <header class="bb-example__bar">
      <a class="bb-brand" href="../index.html"><span class="bb-mark" aria-hidden="true"></span>Bookmark Bookshelf</a>
    </header>
    <main class="bb-example__main">
      <div class="bb-example__head">
        <h1>Store</h1>
        <p class="bb-example__lead">
          Only the store, kept in memory so a reload starts clean: add a link, try an address that is not http or
          https, and watch the exported library change.
        </p>
      </div>
      <form id="add-form" class="bb-example__panel" novalidate>
        <label class="bb-example__field">
          Link
          <input class="bb-input" name="url" type="text" inputmode="url" autocomplete="off" placeholder="https://example.org/article" />
        </label>
        <label class="bb-example__field">
          Title (optional)
          <input class="bb-input" name="title" type="text" autocomplete="off" />
        </label>
        <p id="error" class="bb-example__error" role="alert"></p>
        <p class="bb-example__row">
          <button type="submit" class="bb-button bb-button--solid">Add a link</button>
          <button id="remove-last" type="button" class="bb-button">Remove the last link</button>
        </p>
      </form>
      <div class="bb-example__panel">
        <ul id="list" class="bb-example__list" role="list" aria-label="Links"></ul>
        <pre id="json" class="bb-example__json" aria-label="Exported library"></pre>
      </div>
      <p class="bb-example__back"><a href="../index.html">Back to the homepage</a></p>
    </main>
    <script type="module" src="./store-only.ts"></script>
  </body>
</html>
