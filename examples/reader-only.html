<!doctype html>
<html lang="en" data-variant="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reader: a Bookmark Bookshelf example</title>
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  </head>
  <body class="bb-example">
    <div id="page">
      <header class="bb-example__bar">
        <a class="bb-brand" href="../index.html"><span class="bb-mark" aria-hidden="true"></span>Bookmark Bookshelf</a>
      </header>
      <main class="bb-example__main">
        <div class="bb-example__head">
          <h1>Reader</h1>
          <p class="bb-example__lead">
            Only the reader, with no shelf and no store: it shows a short text, remembers how far you scrolled in
            this tab, and offers a field for text when a link has none.
          </p>
        </div>
        <div class="bb-example__panel">
          <p class="bb-example__row">
            <button id="open-text" type="button" class="bb-button bb-button--solid">Read the example text</button>
            <button id="open-link" type="button" class="bb-button">Open a link with no text</button>
          </p>
        </div>
        <p class="bb-example__back"><a href="../index.html">Back to the homepage</a></p>
      </main>
    </div>
    <div id="reader"></div>
    <script type="module" src="./reader-only.ts"></script>
  </body>
</html>
