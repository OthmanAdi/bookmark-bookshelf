<!doctype html>
<html lang="en" data-variant="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shelf and motion: a Bookmark Bookshelf example</title>
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  </head>
  <body class="bb-example">
    <header class="bb-example__bar">
      <a class="bb-brand" href="../index.html"><span class="bb-mark" aria-hidden="true"></span>Bookmark Bookshelf</a>
    </header>
    <main class="bb-example__main">
      <div class="bb-example__head">
        <h1>Shelf and motion</h1>
        <p class="bb-example__lead">
          Only the shelf and the motion parts, with no store and no reader: drag or flick the row, use the arrow keys
          or pick a spine, and the page names the link you chose.
        </p>
        <label class="bb-example__row">
          Look
          <select id="variant" class="bb-select"></select>
        </label>
      </div>
      <div id="shelf"></div>
      <p id="log" class="bb-example__log" role="status" aria-live="polite"></p>
      <p class="bb-example__back"><a href="../index.html">Back to the homepage</a></p>
    </main>
    <script type="module" src="./shelf-only.ts"></script>
  </body>
</html>
