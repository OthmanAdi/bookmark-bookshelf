<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Your saved links as volumes on a shelf, with a reader for the text you choose to keep." />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#efebe2" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Your shelf · Bookmark Bookshelf</title>
  </head>
  <body class="bb-app">
    <a class="bb-skip" href="#shelf">Skip to the shelf</a>

    <div id="chrome" class="bb-app__chrome">
      <header class="bb-app__bar">
        <a class="bb-wordmark" href="./index.html" aria-label="Bookmark Bookshelf, home">
          <span class="bb-wordmark__sigil" aria-hidden="true"></span>
          <span>Bookmark Bookshelf</span>
        </a>
        <div class="bb-app__tools">
          <div class="bb-search" role="search">
            <label class="bb-visually-hidden" for="search">Search your links</label>
            <svg class="bb-search__icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3.5 3.5" /></svg>
            <input id="search" class="bb-search__field" type="search" placeholder="Search your links" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-keyshortcuts="/" />
            <kbd class="bb-search__key" aria-hidden="true">/</kbd>
            <div id="search-popup" class="bb-search__popup" hidden>
              <ul id="search-results" class="bb-search__list"></ul>
              <p id="search-empty" class="bb-search__empty" hidden></p>
            </div>
            <p id="search-status" class="bb-visually-hidden" role="status" aria-live="polite"></p>
          </div>
          <div class="bb-menu">
            <button id="view-button" type="button" class="bb-button bb-button--quiet bb-menu__button" aria-haspopup="menu">
              View
              <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" focusable="false"><path d="M2.5 4.5 6 8l3.5-3.5" /></svg>
            </button>
            <div id="view-menu" class="bb-menu__panel" role="menu" aria-label="View" hidden></div>
          </div>
          <div class="bb-menu">
            <button id="library-button" type="button" class="bb-button bb-button--quiet bb-menu__button">
              Library
              <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" focusable="false"><path d="M2.5 4.5 6 8l3.5-3.5" /></svg>
            </button>
            <div id="library-menu" class="bb-menu__panel" role="group" aria-label="Library" hidden>
              <button id="library-bring" type="button" class="bb-menu__item bb-menu__item--plain"><span class="bb-menu__label">Bring links in</span></button>
              <button id="library-export" type="button" class="bb-menu__item bb-menu__item--plain"><span class="bb-menu__label">Export library</span></button>
              <button id="library-send" type="button" class="bb-menu__item bb-menu__item--plain"><span class="bb-menu__label">Send the current page here</span></button>
              <button id="library-examples" type="button" class="bb-menu__item bb-menu__item--plain" hidden><span class="bb-menu__label">Remove examples</span></button>
              <div class="bb-menu__rule" role="separator"></div>
              <p id="library-note" class="bb-menu__note">Saved in this browser only. Export a copy before clearing site data.</p>
            </div>
          </div>
          <button id="add" type="button" class="bb-button bb-button--solid">Add a link</button>
        </div>
      </header>

      <p id="storage-warning" class="bb-app__notice" role="status" hidden>This browser is not saving. Changes last until you close this tab.</p>

      <nav class="bb-app__shelves" aria-label="Shelves">
        <div class="bb-app__tabset">
          <div id="tabs" class="bb-tabs"></div>
          <button id="new-shelf" type="button" class="bb-button bb-button--quiet bb-app__new-shelf">New shelf</button>
        </div>
        <div id="shelf-menu-wrap" class="bb-menu bb-app__shelf-menu" hidden>
          <button id="shelf-button" type="button" class="bb-button bb-button--quiet bb-menu__button" aria-haspopup="menu">
            Shelf
            <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" focusable="false"><path d="M2.5 4.5 6 8l3.5-3.5" /></svg>
          </button>
          <div id="shelf-menu" class="bb-menu__panel" role="menu" aria-label="This shelf" hidden>
            <button id="shelf-rename" type="button" role="menuitem" tabindex="-1" class="bb-menu__item bb-menu__item--plain"><span class="bb-menu__label">Rename</span></button>
            <button id="shelf-describe" type="button" role="menuitem" tabindex="-1" class="bb-menu__item bb-menu__item--plain"><span class="bb-menu__label">Describe</span></button>
            <div class="bb-menu__rule" role="separator"></div>
            <button id="shelf-share" type="button" role="menuitem" tabindex="-1" class="bb-menu__item bb-menu__item--plain"><span class="bb-menu__label">Share this shelf</span></button>
            <button id="shelf-hand-in" type="button" role="menuitem" tabindex="-1" class="bb-menu__item bb-menu__item--plain"><span class="bb-menu__label">Hand-in summary</span></button>
            <div class="bb-menu__rule" role="separator"></div>
            <button id="shelf-remove" type="button" role="menuitem" tabindex="-1" class="bb-menu__item bb-menu__item--plain"><span class="bb-menu__label">Remove shelf</span></button>
          </div>
        </div>
      </nav>

      <div id="status-area" class="bb-app__status" hidden>
        <p id="shelf-status" class="bb-app__status-line" hidden></p>
      </div>

      <main id="main" class="bb-app__main">
        <h1 class="bb-visually-hidden">Your shelf</h1>
        <div id="shelf" data-fill></div>
        <div id="caption" class="bb-stage__caption" data-empty="1">
          <div class="bb-stage__head">
            <button id="caption-prev" type="button" class="bb-button bb-stage__arrow" aria-label="Previous link" aria-controls="shelf">
              <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false"><path d="M12.5 4.5 7 10l5.5 5.5" /></svg>
            </button>
            <h2 id="caption-title" class="bb-stage__title"></h2>
            <button id="caption-next" type="button" class="bb-button bb-stage__arrow" aria-label="Next link" aria-controls="shelf">
              <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false"><path d="M7.5 4.5 13 10l-5.5 5.5" /></svg>
            </button>
          </div>
          <p id="caption-line" class="bb-stage__line"></p>
          <div class="bb-stage__actions">
            <button id="action-primary" type="button" class="bb-button bb-button--solid" aria-describedby="caption-title">Read</button>
            <a id="action-original" class="bb-button" href="./app.html" target="_blank" rel="noopener noreferrer" aria-label="Open original, opens in a new tab" aria-describedby="caption-title">Open original</a>
            <button id="action-edit" type="button" class="bb-button bb-button--quiet" aria-describedby="caption-title">Edit</button>
            <button id="action-earlier" type="button" class="bb-button bb-button--quiet" aria-describedby="caption-title" hidden>Move earlier</button>
            <button id="action-later" type="button" class="bb-button bb-button--quiet" aria-describedby="caption-title" hidden>Move later</button>
          </div>
        </div>
        <div id="list" hidden></div>
      </main>
    </div>

    <div id="reader"></div>

    <dialog id="editor" class="bb-dialog" aria-labelledby="editor-title">
      <form id="editor-form" method="dialog" novalidate>
        <h2 id="editor-title" class="bb-dialog__title">Add a link</h2>
        <p id="editor-error" class="bb-dialog__error" role="alert" hidden></p>

        <label class="bb-field">
          <span class="bb-label">Link</span>
          <input name="url" type="url" inputmode="url" autocomplete="url" required placeholder="https://example.org/article" />
        </label>
        <label class="bb-field">
          <span class="bb-label">Title</span>
          <input name="title" type="text" maxlength="300" placeholder="Leave empty to use the site name" />
        </label>
        <div class="bb-field-row">
          <label class="bb-field">
            <span class="bb-label">Author</span>
            <input name="author" type="text" maxlength="200" />
          </label>
          <label class="bb-field">
            <span class="bb-label">Shelf</span>
            <select name="shelfId"></select>
          </label>
        </div>
        <label class="bb-field">
          <span class="bb-label">Why you saved it</span>
          <input name="note" type="text" maxlength="5000" />
        </label>
        <label class="bb-field">
          <span class="bb-label">Tags, separated by commas</span>
          <input name="tags" type="text" />
        </label>
        <div class="bb-field-row">
          <label class="bb-field">
            <span class="bb-label">Cloth</span>
            <select name="cloth"></select>
          </label>
          <label class="bb-field">
            <span class="bb-label">Cover pattern</span>
            <select name="pattern"></select>
          </label>
        </div>
        <label class="bb-field">
          <span class="bb-label">Reading copy, optional</span>
          <textarea name="readingText" rows="6" placeholder="Paste the text you want to read here. The app does not fetch it from the link."></textarea>
          <span class="bb-field__hint">Plain text with simple marks: # headings, - lists, &gt; quotes, **bold**, *italic*.</span>
        </label>

        <div class="bb-dialog__actions">
          <button id="editor-delete" type="button" class="bb-button bb-button--quiet" hidden>Remove volume</button>
          <span class="bb-dialog__spacer"></span>
          <button id="editor-cancel" type="button" class="bb-button">Cancel</button>
          <button id="editor-save" type="submit" class="bb-button bb-button--solid">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="prompt" class="bb-dialog bb-dialog--small" aria-labelledby="prompt-title">
      <form id="prompt-form" method="dialog" novalidate>
        <h2 id="prompt-title" class="bb-dialog__title"></h2>
        <p id="prompt-error" class="bb-dialog__error" role="alert" hidden></p>
        <label class="bb-field">
          <span id="prompt-label" class="bb-label"></span>
          <input id="prompt-input" type="text" maxlength="60" />
        </label>
        <div class="bb-dialog__actions">
          <span class="bb-dialog__spacer"></span>
          <button id="prompt-cancel" type="button" class="bb-button">Cancel</button>
          <button type="submit" class="bb-button bb-button--solid">Save</button>
        </div>
      </form>
    </dialog>

    <div id="toasts" class="bb-toasts" role="status" aria-live="polite"></div>

    <script type="module" src="./src/app/main.ts"></script>
  </body>
</html>
